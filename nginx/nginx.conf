worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    upstream laravel {
        server api:8000;
        keepalive 64;
    }

    upstream nextjs {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Login Admin (route racine Laravel)
        location = /login-admin {
            proxy_pass http://laravel/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Assets statiques Laravel (images, css, js, fonts)
        location ^~ /images/ {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ^~ /build/ {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ^~ /css/ {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ^~ /js/ {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ^~ /fonts/ {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ^~ /storage/ {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Backoffice Admin (Blade Laravel)
        location ^~ /admin {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backoffice Hotel (Blade Laravel)
        location ^~ /hotel {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Laravel
        location ^~ /api {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # WebSocket Reverb
        location ^~ /app/ {
            proxy_pass http://reverb:6001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Frontend Next.js (tout le reste)
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
