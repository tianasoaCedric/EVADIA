worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 50m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    upstream laravel {
        server api:8000;
        keepalive 64;
    }

    upstream nextjs {
        server frontend:3000;
        keepalive 32;
    }

    # /api/client : le web passe par Next.js (cookie httpOnly → Bearer),
    # le mobile (header X-Mobile-Api-Key) va direct à Laravel avec son Bearer token.
    map $http_x_mobile_api_key $client_upstream {
        default "http://nextjs";
        "~.+"   "http://laravel";
    }

    server {
        listen 80;
        server_name _;

        # Login Admin (route racine Laravel)
        location = /login-admin {
            proxy_pass http://laravel/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Assets statiques Laravel (images, css, js, fonts)
        location ^~ /images/ {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ^~ /build/ {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ^~ /css/ {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ^~ /js/ {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ^~ /fonts/ {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ^~ /storage/ {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Backoffice Admin (Blade Laravel)
        location ^~ /admin {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backoffice Hotel (Blade Laravel)
        location ^~ /hotel-admin {
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fichiers statiques Next.js public/ (logos, photos, vidéos)
        location ^~ /videos/ {
            alias /var/www/public/videos/;
            expires 30d;
            add_header Cache-Control "public";
        }

        location ^~ /photos/ {
            alias /var/www/public/photos/;
            expires 30d;
            add_header Cache-Control "public";
        }

        # Logos et fichiers statiques à la racine de public/
        location ~* \.(png|jpg|jpeg|gif|svg|ico|webp)$ {
            root /var/www/public;
            try_files $uri @nextjs;
            expires 30d;
            add_header Cache-Control "public";
        }

        # Proxy client : web → Next.js (cookie httpOnly → Bearer), mobile → Laravel direct
        location ^~ /api/client {
            proxy_pass $client_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Routes Mobile → Laravel direct (Bearer token, pas de cookie)
        location ^~ /api/mobile {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Routes auth Next.js (cookie httpOnly) — login, logout, register, me, forgot-password
        # DOIT être ^~ pour avoir priorité sur /api ci-dessous
        location ^~ /api/auth/login {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
        location ^~ /api/auth/logout {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
        location ^~ /api/auth/register {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
        location ^~ /api/auth/me {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
        location ^~ /api/auth/forgot-password {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
        location ^~ /api/auth/verify-reset-code {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
        location ^~ /api/auth/reset-password {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
        location ^~ /api/auth/google-callback {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # API Laravel (tout le reste, inclut /api/auth/google et /api/auth/google/callback)
        location ^~ /api {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://laravel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # WebSocket Reverb
        location ^~ /app/ {
            proxy_pass http://reverb:6001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Frontend Next.js (tout le reste)
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        location @nextjs {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
