services:

  # ─── Reverse Proxy ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  # ─── API Laravel Octane ──────────────────────────────────────
  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    env_file: .env.docker
    environment:
      - DB_HOST=postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/storage/app
    restart: unless-stopped

  # ─── Queue Worker ─────────────────────────────────────────────
  queue:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file: .env.docker
    environment:
      - DB_HOST=postgres
    depends_on:
      - api
      - redis
    restart: unless-stopped

  # ─── WebSocket Reverb ────────────────────────────────────────
  reverb:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=6001
    env_file: .env.docker
    environment:
      - DB_HOST=postgres
    ports:
      - "6001:6001"
    depends_on:
      - redis
    restart: unless-stopped

  # ─── Frontend Next.js ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost/api
    environment:
      - API_BASE_URL=http://api:8000/api
    restart: unless-stopped

  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    env_file: .env.docker
    environment:
      POSTGRES_DB: evadia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── PgBouncer (connection pooling) ──────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://postgres:1234@postgres:5432/evadia
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      AUTH_TYPE: trust
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
